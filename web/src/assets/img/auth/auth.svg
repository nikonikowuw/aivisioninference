<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422AFB" />
      <stop offset="100%" stop-color="#3182CE" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="200" cy="200" r="300" fill="rgba(255,255,255,0.1)" filter="url(#blur)" />
  <circle cx="1000" cy="800" r="400" fill="rgba(255,255,255,0.15)" filter="url(#blur)" />
  <circle cx="600" cy="500" r="200" fill="rgba(0,0,0,0.1)" filter="url(#blur)" />
  
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Niko Admin</text>
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">A modern enterprise management system</text>
</svg>

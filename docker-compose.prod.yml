services:
  postgres:
    image: postgres:16-alpine
    container_name: niko-admin-postgres
    environment:
      POSTGRES_USER: ${NIKO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NIKO_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${NIKO_DB_NAME:-niko_admin}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NIKO_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - niko-network

  redis:
    image: redis:7-alpine
    container_name: niko-admin-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - niko-network

  # 后端 + 前端服务
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niko-admin-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NIKO_APP_ENV=production
      - NIKO_APP_PORT=8080
      - NIKO_DB_HOST=postgres
      - NIKO_DB_PORT=5432
      - NIKO_DB_USER=${NIKO_DB_USER:-postgres}
      - NIKO_DB_PASSWORD=${NIKO_DB_PASSWORD:-postgres}
      - NIKO_DB_NAME=${NIKO_DB_NAME:-niko_admin}
      - NIKO_REDIS_ENABLE=true
      - NIKO_REDIS_HOST=redis
      - NIKO_REDIS_PORT=6379
      - NIKO_REDIS_PASSWORD=${NIKO_REDIS_PASSWORD:-}
      - NIKO_JWT_SECRET=${NIKO_JWT_SECRET}
      - NIKO_JWT_ISSUER=niko-admin
      - NIKO_JWT_AUDIENCE=niko-admin
      - NIKO_JWT_ACCESS_EXPIRE=3600
      - NIKO_JWT_REFRESH_EXPIRE=604800
      - NIKO_LOG_LEVEL=info
      - NIKO_LOG_FORMAT=json
      - NIKO_LOG_OUTPUT=both
      - NIKO_STORAGE_DRIVER=local
      - NIKO_STORAGE_LOCAL_UPLOAD_DIR=./uploads
      - NIKO_STORAGE_LOCAL_PUBLIC_URL=${NIKO_PUBLIC_URL:-http://localhost:8080}/uploads
    volumes:
      - server-logs:/app/logs
      - server-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - niko-network

volumes:
  pgdata:
  redisdata:
  server-logs:
  server-uploads:

networks:
  niko-network:
    driver: bridge
